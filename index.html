<!-- PRINT CONFIRMATION MODAL OVERLAY -->
<div id="print-modal" class="modal-overlay modal-hide">

            <!-- The Dynamic Visual Label Display Box -->

                <div id="modal-preview-title2" class="p-title2"></div>

                    <span id="modal-preview-qtr"></span>

                </div>
                <div id="modal-preview-months-box" class="p-months-box">
                    <span id="modal-preview-m1"></span>
                    <span id="modal-preview-m2"></span>
                    <span id="modal-preview-m3"></span>
                </div>
            </div> <!-- Ensure this closing tag is clean and has no loose text directly under it -->
            <!-- The Instruction Caption Below -->
            <h1 class="modal-caption">Please take your label</h1>
    </div>
</div>

<!-- STAGE 3: FULLSCREEN INDEPENDENT ADMINISTRATIVE MANAGEMENT SUITE          -->
<!-- ======================================================================= -->
<div id="admin-settings-view" class="screen-hide" style="display: none; background-color: #7851A9; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; box-sizing: border-box; padding: 4vh 4vw; font-family: sans-serif; z-index: 9999999;">
    
    <!-- Top Centered Header Banner Box -->
    <div style="display: flex; justify-content: center; margin-bottom: 5vh;">
        <div style="background-color: #FFFFFF; color: #7851A9; font-weight: bold; font-size: 4vh; padding: 1.5vh 8vw; border-radius: 50px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0,0,0,0.2); letter-spacing: 1px;">
            ADMIN/SETTINGS PAGE
        </div>
    </div>

    <!-- Dual Column Touch Button Menu Grid -->
    <div class="admin-menu-grid" style="display: grid; grid-template-columns: 1fr 1fr; column-gap: 5vw; row-gap: 3.5vh; max-width: 1200px; margin: 0 auto; box-sizing: border-box;">
        
        <!-- ROW 1 -->
        <button class="admin-btn" onclick="handleAdminMenuSelection('MULTIPLES')">
            <span>Print Labels in Multiples</span>
        </button>

        <button class="admin-btn" onclick="handleAdminMenuSelection('EXIT')">
            <span>Exit Admin / Settings Page</span>
        </button>

        <!-- ROW 2 -->
        <button class="admin-btn" onclick="handleAdminMenuSelection('TOGGLE_ROW4')">
            <span>Release Fourth Year Buttons</span>
            <label class="admin-switch">
                <input type="checkbox" id="admin-toggle-row4" disabled>
                <span class="admin-slider"></span>
            </label>
        </button>

        <button class="admin-btn" onclick="handleAdminMenuSelection('EDIT_CATEGORY')">
            <span>Edit Category Labels List</span>
        </button>

        <!-- ROW 3 -->
        <button class="admin-btn" onclick="handleAdminMenuSelection('TOGGLE_CONFIRM')">
            <span>Show Print Confirmation Messages</span>
            <label class="admin-switch">
                <input type="checkbox" id="admin-toggle-confirm" disabled>
                <span class="admin-slider"></span>
            </label>
        </button>

        <button class="admin-btn" onclick="handleAdminMenuSelection('EDIT_TOILETRIES')">
            <span>Edit Toiletries Labels List</span>
        </button>

        <!-- ROW 4 -->
        <button class="admin-btn" onclick="handleAdminMenuSelection('DEFINE_SHORTDATE')">
            <span>Define Short Date Period</span>
        </button>

        <button class="admin-btn" onclick="handleAdminMenuSelection('EDIT_CHRISTMAS')">
            <span>Edit Christmas Labels List</span>
        </button>

        <!-- ROW 5 -->
        <button class="admin-btn" onclick="handleAdminMenuSelection('RESET_PASSWORD')">
            <span>Reset Admin Password</span>
        </button>

        <button class="admin-btn" onclick="handleAdminMenuSelection('EDIT_MISC')">
            <span>Edit Miscellaneous Labels List</span>
        </button>

        <!-- ROW 6 -->
        <button class="admin-btn" onclick="handleAdminMenuSelection('CLOSE_PROGRAM')">
            <span>Close Program</span>
        </button>

        <button class="admin-btn" onclick="handleAdminMenuSelection('EDIT_DISPATCH')">
            <span>Edit Dispatch Labels List</span>
        </button>

    </div>
</div>

<!-- ADMIN PASSWORD CHALLENGE MODAL OVERLAY WITH INTERNAL KEYBOARD -->
<div id="admin-auth-modal" class="modal-overlay modal-hide" style="z-index: 99999999;">
    <div class="modal-content" style="width: 70vw; max-width: 800px; padding: 2.5vh 2.5vw; border: 4px solid #7851A9; gap: 1.5vh;">
        
        <div style="color: #7851A9; font-weight: bold; font-size: 2.8vh; text-transform: uppercase; text-align: center;">
            Security Check Required
        </div>
        
        <!-- Move: Live Requirements Prompt Box directly below heading -->
        <div style="background-color: #f5f5f5; border: 1px solid #ddd; border-radius: 8px; padding: 1vh 1.5vw; width: 100%; box-sizing: border-box; font-size: 1.5vh; color: #555; text-align: center;">
            <strong style="color: #333; display: inline;">PASSWORD REQUIREMENTS:</strong>
            Length 8-16 chars | One Uppercase (A-Z) | One lowercase (a-z) | One Number (0-9)
        </div>
        
        <!-- Native Password Entry Input -->
        <input type="password" id="admin-password-input" placeholder="TAP VIRTUAL KEYBOARD TO ENTER" readonly 
               style="width: 100%; padding: 1.5vh 1vw; font-size: 2.4vh; font-weight: bold; text-align: center; border: 2px solid #333; border-radius: 8px; box-sizing: border-box; outline: none; background: #fff; cursor: default;">

        <!-- NEW DYNAMIC ERROR CALLOUT SLOT -->
        <div id="admin-auth-error-msg" style="color: #ff3b30; font-weight: bold; font-size: 1.6vh; text-align: center; width: 100%; min-height: 2.2vh; display: none; text-transform: uppercase;"></div>

        <!-- KIOSK INTERNAL VIRTUAL TOUCH KEYBOARD AREA -->
        <div id="kiosk-embedded-keyboard">
            <!-- Row 1: Numbers -->
            <div class="kbd-row">
                <button type="button" class="kbd-key" onclick="pressKioskKey('1')">1</button>
                <button type="button" class="kbd-key" onclick="pressKioskKey('2')">2</button>
                <button type="button" class="kbd-key" onclick="pressKioskKey('3')">3</button>
                <button type="button" class="kbd-key" onclick="pressKioskKey('4')">4</button>
                <button type="button" class="kbd-key" onclick="pressKioskKey('5')">5</button>
                <button type="button" class="kbd-key" onclick="pressKioskKey('6')">6</button>
                <button type="button" class="kbd-key" onclick="pressKioskKey('7')">7</button>
                <button type="button" class="kbd-key" onclick="pressKioskKey('8')">8</button>
                <button type="button" class="kbd-key" onclick="pressKioskKey('9')">9</button>
                <button type="button" class="kbd-key" onclick="pressKioskKey('0')">0</button>
            </div>
            <!-- Row 2: QWERTY -->
            <div class="kbd-row">
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('q')">q</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('w')">w</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('e')">e</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('r')">r</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('t')">t</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('y')">y</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('u')">u</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('i')">i</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('o')">o</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('p')">p</button>
            </div>
            <!-- Row 3: ASDF -->
            <div class="kbd-row">
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('a')">a</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('s')">s</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('d')">d</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('f')">f</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('g')">g</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('h')">h</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('j')">j</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('k')">k</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('l')">l</button>
            </div>
            <!-- Row 4: ZXCV & Modifiers -->
            <div class="kbd-row">
                <button type="button" id="kbd-shift-btn" class="kbd-key utility-key" onclick="toggleKioskShift()" style="flex: 1.5; background: #90caf9;">SHIFT</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('z')">z</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('x')">x</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('c')">c</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('v')">v</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('b')">b</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('n')">n</button>
                <button type="button" class="kbd-key letter-key" onclick="pressKioskKey('m')">m</button>
                <button type="button" class="kbd-key utility-key" onclick="backspaceKioskKey()" style="flex: 1.5; background: #ffb74d;">BACK</button>
            </div>
        </div>

        <!-- Action Control Buttons Row -->
        <div style="display: flex; gap: 2vw; width: 100%; margin-top: 1vh;">
            <button onclick="submitAdminPasswordVerification()" style="flex: 1; background-color: #4cd964; color: white; border: none; padding: 1.8vh; font-size: 2.2vh; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">Confirm</button>
            <button onclick="cancelAdminPasswordVerification()" style="flex: 1; background-color: #ff3b30; color: white; border: none; padding: 1.8vh; font-size: 2.2vh; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">Cancel</button>
        </div>
    </div>
</div>
